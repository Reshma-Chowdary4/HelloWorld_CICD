name: Build and Deploy to EC2

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: dev

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '17'

    - name: Cache Maven local repository
      uses: actions/cache@v4
      with:
        path: ~/.m2/repository
        key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
        restore-keys: |
          ${{ runner.os }}-m2-

    - name: Build with Maven
      run: mvn -B -DskipTests package

    - name: Validate required secrets
      run: |
        # Fail fast with a clear message if any required secret is missing
        if [ -z "${{ secrets.EC2_HOST }}" ]; then echo "ERROR: EC2_HOST secret is not set"; exit 1; fi
        if [ -z "${{ secrets.EC2_USER }}" ]; then echo "ERROR: EC2_USER secret is not set"; exit 1; fi
        if [ -z "${{ secrets.SSH_PRIVATE_KEY }}" ]; then echo "ERROR: SSH_PRIVATE_KEY secret is not set"; exit 1; fi
        if [ -z "${{ secrets.DEPLOY_PATH }}" ]; then echo "ERROR: DEPLOY_PATH secret is not set"; exit 1; fi
        echo "All required secrets present. SERVICE_NAME (optional)='${{ secrets.SERVICE_NAME }}'"

    - name: "Debug: secrets presence & basic checks (no values leaked)"
      run: |
        set -e
        echo "Runner: $(uname -a)"
        # For each secret, print whether it's set and its length (do NOT print the secret value)
        check() {
          name=$1
          val="$2"
          if [ -n "$val" ]; then
            echo "$name: set (length=${#val})"
          else
            echo "$name: NOT SET"
          fi
        }
        check EC2_HOST "${{ secrets.EC2_HOST }}"
        check EC2_USER "${{ secrets.EC2_USER }}"
        # Do not leak SSH_PRIVATE_KEY contents; only show length
        check SSH_PRIVATE_KEY "${{ secrets.SSH_PRIVATE_KEY }}"
        check DEPLOY_PATH "${{ secrets.DEPLOY_PATH }}"
        check SERVICE_NAME "${{ secrets.SERVICE_NAME }}"
        if [ -n "${{ secrets.DEPLOY_PATH }}" ]; then
          case "${{ secrets.DEPLOY_PATH }}" in
            /*) echo "DEPLOY_PATH looks absolute";;
            *) echo "DEPLOY_PATH does not look absolute";;
          esac
        fi

    - name: Prepare SSH
      run: |
        mkdir -p ~/.ssh
        echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
        chmod 600 ~/.ssh/id_rsa
        # Add host to known_hosts to avoid interactive prompt
        ssh-keyscan -H "${{ secrets.EC2_HOST }}" >> ~/.ssh/known_hosts || true

    - name: Upload artifact to EC2 (scp)
      run: |
        scp -o StrictHostKeyChecking=yes -i ~/.ssh/id_rsa target/*.jar ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:${{ secrets.DEPLOY_PATH }}

    - name: Upload environment file to EC2 (optional)
      run: |
        if [ -n "${{ secrets.APP_ENVIRONMENT }}" ]; then
          printf "%s\n" "${{ secrets.APP_ENVIRONMENT }}" | ssh -o StrictHostKeyChecking=yes -i ~/.ssh/id_rsa ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} "sudo tee /etc/default/${{ secrets.SERVICE_NAME }} > /dev/null && sudo chmod 640 /etc/default/${{ secrets.SERVICE_NAME }} && sudo chown root:root /etc/default/${{ secrets.SERVICE_NAME }}"
        else
          echo "No APP_ENVIRONMENT provided; skipping env upload"
        fi

    - name: Restart service on EC2
      run: |
        ssh -o StrictHostKeyChecking=yes -i ~/.ssh/id_rsa ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} "bash -lc 'set -e; DEPLOY_DIR=\"${{ secrets.DEPLOY_PATH }}\"; SERVICE_NAME=\"${{ secrets.SERVICE_NAME }}\"; mkdir -p \"$DEPLOY_DIR\"; if ls \"$DEPLOY_DIR\"/*.jar 1> /dev/null 2>&1; then sudo mv \"$DEPLOY_DIR\"/*.jar \"$DEPLOY_DIR\"/app.jar || true; sudo chmod 644 \"$DEPLOY_DIR\"/app.jar || true; else echo \"No jar found in $DEPLOY_DIR\"; exit 1; fi; if [ -n \"$SERVICE_NAME\" ]; then sudo systemctl daemon-reload || true; sudo systemctl restart \"$SERVICE_NAME\"; sudo systemctl status \"$SERVICE_NAME\" --no-pager || true; else echo \"SERVICE_NAME not set, starting jar manually\"; sudo nohup java -jar \"$DEPLOY_DIR\"/app.jar >/var/log/helloworld.log 2>&1 & fi'"




