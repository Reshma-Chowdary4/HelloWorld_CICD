name: Build and Deploy to EC2

on:
  push:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '17'

    - name: Cache Maven local repository
      uses: actions/cache@v4
      with:
        path: ~/.m2/repository
        key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
        restore-keys: |
          ${{ runner.os }}-m2-

    - name: Build with Maven
      run: mvn -B -DskipTests package

    - name: Upload artifact to EC2 (SCP)
      uses: appleboy/scp-action@v0.1.8
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ${{ secrets.EC2_USER }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        port: 22
        source: target/*.jar
        target: ${{ secrets.DEPLOY_PATH }}

    - name: Upload environment file to EC2 (optional)
      uses: appleboy/ssh-action@v0.1.8
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ${{ secrets.EC2_USER }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        port: 22
        script: |
          set -e
          SERVICE_NAME="${{ secrets.SERVICE_NAME }}"
          # APP_ENVIRONMENT secret should contain lines like VAR=value
          if [ -n "${{ secrets.APP_ENVIRONMENT }}" ]; then
            echo "Writing environment file to /etc/default/$SERVICE_NAME"
            printf "%s\n" "${{ secrets.APP_ENVIRONMENT }}" | sudo tee /etc/default/"$SERVICE_NAME" >/dev/null
            sudo chmod 640 /etc/default/"$SERVICE_NAME"
            sudo chown root:root /etc/default/"$SERVICE_NAME"
          else
            echo "No APP_ENVIRONMENT secret provided; skipping env file write"
          fi

    - name: Restart service on EC2
      uses: appleboy/ssh-action@v0.1.8
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ${{ secrets.EC2_USER }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        port: 22
        script: |
          set -e
          DEPLOY_DIR="${{ secrets.DEPLOY_PATH }}"
          SERVICE_NAME="${{ secrets.SERVICE_NAME }}"
          # Ensure deploy dir exists (scp action will have uploaded jar to this dir)
          mkdir -p "$DEPLOY_DIR"
          # Move uploaded jar to a stable name
          if ls "$DEPLOY_DIR"/*.jar 1> /dev/null 2>&1; then
            sudo mv "$DEPLOY_DIR"/*.jar "$DEPLOY_DIR"/app.jar || true
            sudo chmod 644 "$DEPLOY_DIR"/app.jar || true
          else
            echo "No jar found in $DEPLOY_DIR"
            exit 1
          fi
          # Reload systemd and restart the service
          if [ -n "$SERVICE_NAME" ]; then
            sudo systemctl daemon-reload || true
            sudo systemctl restart "$SERVICE_NAME"
            sudo systemctl status "$SERVICE_NAME" --no-pager
          else
            echo "SERVICE_NAME secret is not set. Starting jar manually."
            sudo nohup java -jar "$DEPLOY_DIR"/app.jar >/var/log/helloworld.log 2>&1 &
          fi


